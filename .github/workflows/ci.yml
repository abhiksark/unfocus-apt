name: APT CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apt-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install APT tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg
      - run: ruby script/workflow_contract_test.rb
      - run: ./script/build_apt_repo_test.sh
