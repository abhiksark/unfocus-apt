name: Update alpha apt repository

on:
  repository_dispatch:
    types: [unfocus-alpha-published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Published Unfocus prerelease tag to bootstrap or recover
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-unfocus-apt
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install apt tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg
      - run: ./script/build_apt_repo_test.sh

  update:
    needs: test
    runs-on: ubuntu-24.04
    environment: apt-repo-automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_TOKEN push to main after rebuilding the tree
          persist-credentials: true

      - name: Install apt tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg

      - name: Import the archive signing key
        id: gpg
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "${APT_SIGNING_KEY:-}" ] || {
            echo "APT_SIGNING_KEY secret is required in the apt-repo-automation environment." >&2
            exit 1
          }
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printenv APT_SIGNING_KEY | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ { print $5; exit }')
          [ -n "$KEY_ID" ]
          : > "$RUNNER_TEMP/gpg-passphrase"
          if [ -n "${APT_SIGNING_KEY_PASSPHRASE:-}" ]; then
            printenv APT_SIGNING_KEY_PASSPHRASE > "$RUNNER_TEMP/gpg-passphrase"
          fi
          chmod 600 "$RUNNER_TEMP/gpg-passphrase"
          {
            echo "key_id=$KEY_ID"
            echo "gnupg_home=$GNUPGHOME"
          } >> "$GITHUB_OUTPUT"

      - name: Re-query the release and download required assets
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag_name }}
          PAYLOAD_RELEASE_ID: ${{ github.event.client_payload.release_id }}
          PAYLOAD_SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = repository_dispatch ]; then
            SOURCE_REPOSITORY=$PAYLOAD_SOURCE_REPOSITORY
            RELEASE_ID=$PAYLOAD_RELEASE_ID
            TAG_NAME=$PAYLOAD_TAG
          else
            SOURCE_REPOSITORY=abhiksark/unfocus
            TAG_NAME=$INPUT_TAG
            [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-alpha\.(0|[1-9][0-9]*)$ ]] || {
              echo "Manual runs require an exact vX.Y.Z-alpha.N tag." >&2
              exit 1
            }
            RELEASE_ID=$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$TAG_NAME" --jq .id)
          fi

          [ "$SOURCE_REPOSITORY" = abhiksark/unfocus ] || {
            echo "Unexpected source repository: $SOURCE_REPOSITORY" >&2
            exit 1
          }
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || {
            echo "Release id must be numeric." >&2
            exit 1
          }
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-alpha\.(0|[1-9][0-9]*)$ ]] || {
            echo "Release tag is not an exact alpha prerelease version." >&2
            exit 1
          }

          gh api "repos/$SOURCE_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/release.json"
          DRAFT=$(jq -r .draft "$RUNNER_TEMP/release.json")
          PRERELEASE=$(jq -r .prerelease "$RUNNER_TEMP/release.json")
          PUBLISHED_AT=$(jq -r .published_at "$RUNNER_TEMP/release.json")
          [ "$DRAFT" = false ] && [ "$PRERELEASE" = true ] && [ "$PUBLISHED_AT" != null ] && [ -n "$PUBLISHED_AT" ] || {
            echo "$TAG_NAME is not a published, non-draft prerelease." >&2
            exit 1
          }
          SOURCE_DATE_EPOCH=$(date --date="$PUBLISHED_AT" +%s)

          VERSION=${TAG_NAME#v}
          mkdir -p "$RUNNER_TEMP/unfocus-assets"
          for NAME in "Unfocus_${VERSION}_amd64.deb" SHA256SUMS; do
            ASSET_ID=$(jq -r --arg name "$NAME" \
              '[.assets[] | select(.name == $name) | .id] | if length == 1 then .[0] else error("expected exactly one matching asset for " + $name) end' \
              "$RUNNER_TEMP/release.json")
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$SOURCE_REPOSITORY/releases/assets/$ASSET_ID" \
              > "$RUNNER_TEMP/unfocus-assets/$NAME"
          done

          {
            echo "source_repository=$SOURCE_REPOSITORY"
            echo "release_id=$RELEASE_ID"
            echo "tag_name=$TAG_NAME"
            echo "version=$VERSION"
            echo "source_date_epoch=$SOURCE_DATE_EPOCH"
          } >> "$GITHUB_OUTPUT"

      - name: Rebuild the alpha APT repository
        id: update
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          SOURCE_REPOSITORY: ${{ steps.release.outputs.source_repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
          GNUPGHOME: ${{ steps.gpg.outputs.gnupg_home }}
          GPG_KEY_ID: ${{ steps.gpg.outputs.key_id }}
        run: |
          set -euo pipefail
          UPDATE_ARGS=(
            --channel alpha
            --source-repository "$SOURCE_REPOSITORY"
            --release-id "$RELEASE_ID"
            --tag-name "$TAG_NAME"
            --assets-dir "$RUNNER_TEMP/unfocus-assets"
            --repo-root "$GITHUB_WORKSPACE"
            --gpg-home "$GNUPGHOME"
            --gpg-key-id "$GPG_KEY_ID"
            --source-date-epoch "$SOURCE_DATE_EPOCH"
            --metadata "$RUNNER_TEMP/update.json"
          )
          if [ -s "$RUNNER_TEMP/gpg-passphrase" ]; then
            UPDATE_ARGS+=(--passphrase-file "$RUNNER_TEMP/gpg-passphrase")
          fi
          ./script/update_repo.sh "${UPDATE_ARGS[@]}"
          {
            echo "changed=$(jq -r .changed "$RUNNER_TEMP/update.json")"
            echo "deb_name=$(jq -r .deb_name "$RUNNER_TEMP/update.json")"
            echo "deb_sha256=$(jq -r .deb_sha256 "$RUNNER_TEMP/update.json")"
            echo "debian_version=$(jq -r .debian_version "$RUNNER_TEMP/update.json")"
            echo "release_url=$(jq -r .release_url "$RUNNER_TEMP/update.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push the apt tree to main
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DEB_NAME: ${{ steps.update.outputs.deb_name }}
          DEB_SHA256: ${{ steps.update.outputs.deb_sha256 }}
          DEBIAN_VERSION: ${{ steps.update.outputs.debian_version }}
          RELEASE_URL: ${{ steps.update.outputs.release_url }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pool/main/u/unfocus dists/alpha public-key.asc
          git diff --cached --quiet && {
            echo "Updater reported a change but produced no apt tree diff." >&2
            exit 1
          }
          git commit -m "Update unfocus alpha apt packages to $VERSION"
          git push origin "HEAD:main"
          echo "Published $DEB_NAME ($DEBIAN_VERSION) from $RELEASE_URL"
          echo "SHA256 $DEB_SHA256"
